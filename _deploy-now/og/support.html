<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1200px; height:630px; overflow:hidden; display:grid; grid-template-columns:1fr 330px; gap:56px; align-items:center;
    padding:70px 80px; color:#fff;
    background:radial-gradient(circle at 84% 22%,rgba(255,122,26,.30),transparent 36%),#171a20;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif; }
  .kicker { display:flex; align-items:center; gap:12px; color:rgba(255,255,255,.72); font-size:18px; font-weight:850; letter-spacing:.16em; }
  .kicker i { width:12px; height:12px; border-radius:50%; background:#ff7a1a; box-shadow:0 0 0 7px rgba(255,122,26,.18); }
  h1 { margin:30px 0 0; font-size:62px; line-height:1.34; letter-spacing:-.02em; word-break:auto-phrase; }
  h1 em { color:#ff7a1a; font-style:normal; }
  p.lead { margin:30px 0 0; color:rgba(255,255,255,.78); font-size:22px; line-height:1.85; }
  .visual { position:relative; display:grid; place-items:center; }
  .visual::before { content:""; position:absolute; width:330px; height:330px; border:1px solid rgba(255,255,255,.16); border-radius:50%; }
  .visual img { width:224px; height:224px; border-radius:50px; box-shadow:0 30px 60px rgba(0,0,0,.45); }
</style>
</head>
<body>
  <div>
    <p class="kicker"><i></i>ANDROID PROJECT</p>
    <h1>Android版に必要なのは、<br>お金より先に<br><em>12人の仲間</em>です</h1>
    <p class="lead">アンクラスPort ／ テスター募集中・費用はかかりません</p>
  </div>
  <div class="visual"><img src="/assets/anclas-port-icon.png" alt=""></div>
</body>
</html>
