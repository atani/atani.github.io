<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1200px; height:630px; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between;
    padding:76px 80px; color:#fff;
    background:radial-gradient(circle at 78% 18%,rgba(82,109,255,.34),transparent 34%),#171a20;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif; }
  .kicker { display:flex; align-items:center; gap:12px; color:rgba(255,255,255,.72); font-size:19px; font-weight:850; letter-spacing:.16em; }
  .kicker i { width:12px; height:12px; border-radius:50%; background:#ff7a1a; box-shadow:0 0 0 7px rgba(255,122,26,.18); }
  h1 { margin:34px 0 0; font-size:78px; line-height:1.32; letter-spacing:-.02em; word-break:auto-phrase; }
  h1 em { color:#ff7a1a; font-style:normal; }
  .foot { display:flex; align-items:center; gap:20px; }
  .foot img { width:76px; height:76px; border-radius:50%; }
  .foot b { display:block; font-size:27px; }
  .foot span { color:rgba(255,255,255,.68); font-size:19px; }
  .tag { margin-left:auto; padding:13px 22px; border:1px solid rgba(255,255,255,.28); border-radius:999px; color:rgba(255,255,255,.85); font-size:19px; font-weight:750; }
</style>
</head>
<body>
  <div>
    <p class="kicker"><i></i>BUILDING IN FUKUOKA</p>
    <h1>好きなものを、<br><em>使い続けられる形に。</em></h1>
  </div>
  <div class="foot">
    <img src="/assets/profile-icon.png" alt="">
    <div><b>Akira Taniwaki</b><span>Independent Developer</span></div>
    <span class="tag">iPhoneアプリ 8本を公開中</span>
  </div>
</body>
</html>
